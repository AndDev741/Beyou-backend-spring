spring:
  profiles:
    active: ${ACTIVE_PROFILE}
  threads:
    virtual:
      enabled: true
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5490/beyou}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema in every environment; Hibernate only validates
      # entity mappings against it. Guarded by SchemaOwnershipGuard — no env
      # override on purpose (a stray `update` would mean two schema writers).
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  ai:
    # Only DeepSeek is auto-configured as a chat model; the free providers in
    # the fallback chain are built manually in LlmChainConfig from the
    # spring-ai-openai lib.
    model:
      chat: deepseek
    openai:
      # No OpenAI consumer remains (routine generation was removed), but the
      # starter's other modality autoconfigs (audio/embedding/image) still
      # demand a credential at boot. Noop key keeps them quiet.
      api-key: dev-noop
    deepseek:
      api-key: ${DEEP_API_KEY:dev-noop}
      chat:
        options:
          model: ${AI_AGENT_MODEL:deepseek-v4-flash}
    chat:
      client:
        enabled: false
      memory:
        repository:
          jdbc:
            initialize-schema: never
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # JavaMail defaults all three of these to -1, which means wait forever.
          # That is not a theoretical risk here: PasswordResetService and
          # AccountDeletionService send synchronously inside afterCommit, so an
          # SMTP server that never answers pins the user's request AND the JDBC
          # connection it is still holding (afterCommit runs before the connection
          # goes back to the pool, and the pool is at Hikari's default 10). A
          # handful of stuck forgot-password calls is enough to starve the pool and
          # take down every other endpoint with it. 5s is far more than a healthy
          # Gmail handshake needs and far less than a user will sit through.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      # Slightly above the service-level 5MB check so a 5-6MB upload reaches
      # PhotoStorageService and gets the friendly PHOTO_UPLOAD_TOO_LARGE message
      # (with the actual size); anything larger is rejected at the container with
      # the same error key via GlobalExceptionHandler.
      max-file-size: 6MB
      max-request-size: 6MB

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  # How long a signed profile-photo URL stays loadable. The URL is the only proof
  # the image endpoint gets, so it expires; 12h keeps a tab left open overnight
  # working while a link leaked into a log or a browser history dies the same day.
  photo-url-ttl-minutes: ${PHOTO_URL_TTL_MINUTES:720}

server:
  port: 8099
  address: 0.0.0.0
  servlet:
    context-path: /api/v1

cookie:
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:Lax}

cors:
  allowed-pattern: ${CORS_ALLOWED_PATTERN}

api:
  security:
    token:
      secret: ${TOKEN_SECRET}

google:
  secrets:
    clientId: ${GOOGLE_CLIENT_ID}
    clientSecret: ${GOOGLE_CLIENT_SECRET}
  mobile:
    # Allowed audiences for mobile Google ID tokens (comma-separated). Defaults to
    # the web client id; add the Android/iOS client ids via GOOGLE_MOBILE_AUDIENCES.
    audiences: ${GOOGLE_MOBILE_AUDIENCES:${GOOGLE_CLIENT_ID}}
  url:
    oauth: ${OAUTH_GOOGLE_URL}
    userInfo: ${USER_INFO_GOOGLE_URL}

frontend:
    url: ${FRONTEND_URL}

mail:
  from: ${MAIL_FROM:${MAIL_USERNAME}}

password-reset:
  token-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:15}
  cooldown-minutes: ${PASSWORD_RESET_COOLDOWN_MINUTES:5}

# The link that proves a new account owns its address. The cooldown is in seconds
# for the same reason the deletion one below is: the user is sitting on the login
# screen having just been told their email is not verified, and the resend button
# beside that message has to work in the same sitting. It exists to stop a double
# tap from replacing the token in the link they are about to click, not to ration
# requests — the shared auth bucket in RateLimitFilter does the rationing.
email-verification:
  token-ttl-hours: ${EMAIL_VERIFICATION_TTL_HOURS:24}
  cooldown-seconds: ${EMAIL_VERIFICATION_COOLDOWN_SECONDS:60}

# The emailed code that has to come back before an account is deleted. The
# cooldown is in seconds, not minutes like the reset above: this code is typed
# into the app while the user waits on the screen, so "resend" has to be usable
# within the same sitting. The generic per-user write bucket already caps the
# request rate; this only stops a rapid double-tap from burning the first mail.
account-deletion:
  code-ttl-minutes: ${ACCOUNT_DELETION_CODE_TTL_MINUTES:15}
  cooldown-seconds: ${ACCOUNT_DELETION_COOLDOWN_SECONDS:60}

# Engagement nudges (phase 1). Thresholds rather than constants because every one of
# them was picked without a baseline to pick it from: the product analytics that would
# justify a number only started collecting the day this was written. Expect to move them.
engagement:
  # OFF by default, and that is load-bearing rather than cautious. The privacy policy has
  # to describe a new use of somebody's data BEFORE it starts, so the ordering is: policy
  # merges and deploys, then this flips. A flag makes that a property of the deployment
  # instead of something an operator has to remember.
  enabled: ${ENGAGEMENT_NUDGES_ENABLED:false}
  # The reader's local hour. Early evening: late enough that somebody who was going to do
  # their routine today mostly has, so the mail is not nagging about a day still in
  # progress, and early enough that acting on it does not mean staying up. Deliberately
  # clear of the snapshot job's hours (0, and the 2-3 grace window) so the two passes do
  # not contend for the same connection pool.
  send-local-hour: ${ENGAGEMENT_SEND_LOCAL_HOUR:19}
  # Across every account, per day. Sized well under the provider's free-tier ceiling of
  # 300/day because that allowance also carries verification, password resets and deletion
  # codes — mail people actually asked for. A reset that does not arrive because a nudge
  # spent the budget is a much worse failure than a nudge that never goes out.
  daily-cap: ${ENGAGEMENT_DAILY_CAP:100}
  # Minimum gap, in the reader's days, between any two nudges to one account. Two triggers
  # can each be individually justified on the same morning; their sum is not.
  min-days-between: ${ENGAGEMENT_MIN_DAYS_BETWEEN:3}
  # The shortest run worth writing to somebody about. A two-day streak costs more goodwill
  # to defend by mail than it is worth.
  min-streak-to-defend: ${ENGAGEMENT_MIN_STREAK_TO_DEFEND:3}
  # How far below the account's own record still counts as "at risk".
  record-gap: ${ENGAGEMENT_RECORD_GAP:2}
  # Mirrors RoutineSnapshotScheduler.MAX_BACKFILL_DAYS. These two MUST agree: a mail about
  # a day the snapshot job will not accept a check for is a lie.
  backfill-days: ${ENGAGEMENT_BACKFILL_DAYS:7}

rate-limit:
  enabled: true

ai:
  agent:
    # tool_choice sent with every agent turn. Blank leaves the provider on `auto`,
    # where the model may answer without calling anything — which is how a turn once
    # told a user their goal was updated without ever attempting the write.
    # `required` removes that move, at the cost of forcing a tool call on every
    # message including "thanks", with the model choosing which tool. Flip it
    # deliberately and watch what the agent reaches for.
    tool-choice: ${AI_AGENT_TOOL_CHOICE:}
  llm-chain:
    order: ${LLM_CHAIN_ORDER:mistral,gemini,glm,nvidia,deepseek}
    # Providers this environment refuses to call, whatever `order` says. Empty
    # here so local and e2e can exercise the whole chain; application-prod.yaml
    # fills it in.
    blocked: ${LLM_CHAIN_BLOCKED:}
    cooldown-rate-limit-seconds: ${LLM_COOLDOWN_RATELIMIT:300}
    cooldown-error-seconds: ${LLM_COOLDOWN_ERROR:30}
    providers:
      gemini:
        base-url: https://generativelanguage.googleapis.com/v1beta/openai
        api-key: ${GEMINI_API_KEY:}
        model: ${GEMINI_MODEL:gemini-2.5-flash}
      mistral:
        base-url: https://api.mistral.ai/v1
        api-key: ${MISTRAL_API_KEY:}
        model: ${MISTRAL_MODEL:mistral-small-latest}
      glm:
        base-url: https://api.z.ai/api/paas/v4
        api-key: ${GLM_API_KEY:}
        model: ${GLM_MODEL:glm-4.7-flash}
      generic:
        base-url: ${GENERIC_BASE_URL:}
        api-key: ${GENERIC_API_KEY:}
        model: ${GENERIC_MODEL:}
      nvidia:
        base-url: https://integrate.api.nvidia.com/v1
        api-key: ${NVIDIA_API_KEY:}
        model: ${NVIDIA_MODEL:meta/llama-3.3-70b-instruct}

docs:
  import:
    repoOwner: ${DOCS_IMPORT_REPO_OWNER:AndDev741}
    repoName: ${DOCS_IMPORT_REPO_NAME:beyou-arch-design}
    branch: ${DOCS_IMPORT_BRANCH:main}
    path: ${DOCS_IMPORT_PATH:architecture}
    blog:
      path: ${DOCS_IMPORT_BLOG_PATH:blog}
    api:
      path: ${DOCS_IMPORT_API_PATH:api}
    projects:
      path: ${DOCS_IMPORT_PROJECTS_PATH:projects}
    token: ${DOCS_IMPORT_TOKEN:}
    secret: ${DOCS_IMPORT_SECRET:}

# Every log line carries the id of the user the request is for. `logging.pattern.correlation`
# is Boot's own slot for per-request identity inside the default console AND file patterns
# (it is where trace ids go when tracing is on), so this keeps working across a Boot upgrade
# that reshuffles those patterns — overriding `logging.pattern.console` would not.
#
# UserContextLogFilter fills the MDC key. Lines with no user in scope — startup, the snapshot
# scheduler, unauthenticated calls — print `anonymous` rather than an empty field, so every
# line has the same shape and the log-shipping side has one pattern to parse instead of two.
logging:
  pattern:
    correlation: "[userId=%X{userId:-anonymous}] "

# Error telemetry — unhandled exceptions are shipped to the self-hosted GlitchTip
# collector (Sentry-API compatible) run by Beyou-dev-env's monitoring overlay.
#
# `sentry.dsn` is deliberately NOT declared here with a `${SENTRY_DSN:}` default.
# Sentry's autoconfiguration is @ConditionalOnProperty("sentry.dsn"), and an empty
# string still counts as "present" — declaring it would wire every Sentry bean into
# every environment. Spring's relaxed binding maps the SENTRY_DSN environment
# variable straight onto `sentry.dsn`, so setting that env var is the ONLY way the
# integration switches on. No DSN in the environment = no Sentry beans at all.
sentry:
  # Hard requirement: no PII reaches the collector. With send-default-pii=false
  # SentryRequestResolver drops every sensitive request header (Authorization,
  # Cookie, X-Api-Key, X-Forwarded-For, Proxy-Authorization, the CSRF headers…),
  # never attaches cookies, and SentryUserFilter never attaches the caller's IP.
  send-default-pii: false
  # Never capture request bodies — they carry habit/goal/task text written by users.
  # NONE is also the SDK default; pinned so a future SDK default change can't leak it.
  max-request-body-size: none
  # The Logback integration (io.sentry:sentry-logback) buys two things the MVC exception
  # resolver cannot:
  #   * breadcrumbs — a captured exception arrives with the log lines that led to it
  #     instead of a bare stack trace;
  #   * events for handled failures — code that catches and logs its own exception is
  #     otherwise invisible. The async listeners in notification/EmailService do exactly
  #     that on purpose (a failed send must never cost a user's feedback submission), so
  #     a dead SMTP server used to be silent on both ends.
  #
  # It also drags whatever a log line interpolates into the collector, which is why
  # SentryBreadcrumbFilter exists. Both thresholds below are load-bearing:
  #   * breadcrumbs at INFO — the app's useful trail (LLM provider fallbacks, failed
  #     e-mail sends, snapshot decisions, connection-pool warnings) is logged at INFO/WARN.
  #   * events at ERROR — GlobalExceptionHandler logs an upstream response body at WARN.
  #     Lowering this would turn that body into an event message, which no breadcrumb
  #     filter can intercept. Locked in by SentryTelemetryConfigTest.
  # Which loggers are excluded from each channel, and why, lives in
  # config/SentryLoggerExclusions.
  logging:
    enabled: true
    minimum-breadcrumb-level: info
    minimum-event-level: error
  # Load-bearing once the Logback appender is on: an unhandled exception is logged at ERROR
  # by ServiceMethodsLogging, logged again by ControllerLogging, and then captured by the
  # MVC exception resolver — three captures of one fault. Deduplication (an SDK default,
  # pinned here so a future default change can't quietly triple the issue count) keeps only
  # the first. It runs as an event processor, i.e. BEFORE SentryEventFilter, which is why
  # the duplicates must not be dropped by logger name in that callback — doing so would
  # leave the throwable registered as seen and suppress the real report too.
  #
  # Verified against the live collector with a forced 500 (paused Postgres): the aspects'
  # two ERROR logs and the MVC resolver collapsed into ONE issue. One residual duplicate
  # survives — Tomcat logs the same failure a second time with its ROOT CAUSE
  # ("Servlet.service() … with root cause"), a different throwable instance, so
  # deduplication cannot match it and it lands as its own issue titled after the root
  # cause. Left in deliberately: that log line is also the only signal for exceptions
  # thrown in the servlet filter chain, which never reach the MVC resolver at all, and
  # excluding it would mean matching a logger name that embeds the servlet context path.
  enable-deduplication: true
  # Ties an event to the build that produced it. CI publishes images tagged
  # `sha-<short sha>` — pass the matching value, e.g. beyou-backend@sha-1a2b3c4.
  release: ${SENTRY_RELEASE:beyou-backend@local}
  environment: ${SENTRY_ENVIRONMENT:local}
  # No GitProperties bean is produced by this build, so git-based releases would
  # silently resolve to nothing. Off, so `release` above is the single source.
  use-git-commit-id-as-release: false
  # Run Sentry's capturing HandlerExceptionResolver LAST (Ordered.LOWEST_PRECEDENCE)
  # so anything GlobalExceptionHandler (@ControllerAdvice) already resolved never
  # reaches it. Defence in depth for the MVC path only — the real guarantee that a
  # handled BusinessException is never reported is SentryEventFilter's
  # BeforeSendCallback, which runs for every capture path.
  exception-resolver-order: 2147483647

# Liveness signal for the scheduled snapshot job.
#
# The collector's uptime check against /actuator/health proves the process answers.
# It cannot prove RoutineSnapshotScheduler is still firing — a wedged scheduler thread
# keeps health green while snapshots silently stop. So the job checks in after every
# completed hourly cycle and the collector alerts on a MISSING check-in.
#
# Empty = disabled, and nothing outbound is ever attempted. Create a Heartbeat monitor
# in GlitchTip, copy its endpoint URL here, and set the monitor's expected interval to
# 5400s (the job's hourly cadence plus 30 minutes of slack, so one slow or skipped run
# is not an alert). See Beyou-dev-env/README.md.
monitoring:
  heartbeat:
    snapshot-url: ${SNAPSHOT_HEARTBEAT_URL:}
    # The nudge pass, same inverted-check reasoning as above and arguably more necessary:
    # a snapshot job that stops running eventually shows up as missing history, whereas a
    # nudge job that stops running looks exactly like a quiet week. Nobody complains about
    # mail they did not receive. Expect a check-in once per hour while the flag is on.
    nudge-url: ${NUDGE_HEARTBEAT_URL:}

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS:health,metrics,prometheus}
  health:
    mail:
      # Boot's MailHealthIndicator calls testConnection(), which opens a real
      # TCP + EHLO + STARTTLS + AUTH LOGIN session against the SMTP host on EVERY
      # request to /actuator/health — the health endpoint caches nothing by default.
      # It buys nothing we do not already have: every failed send logs at ERROR and
      # every ERROR is already an event in GlitchTip. What it cost was a probe whose
      # latency was the mail provider's to decide, plus ~1440 AUTH LOGIN attempts a
      # day at Gmail from a single IP.
      enabled: false
  endpoint:
    health:
      group:
        # The uptime monitor polls this group instead of the whole endpoint, so no
        # indicator added later can put a network call back on the probe path — the
        # membership list is the allowlist. Deliberately NOT named "readiness":
        # Boot autoconfigures groups called liveness/readiness when availability
        # probes are on, and an explicit group of that name would shadow the
        # readinessState indicator. validate-group-membership is true by default,
        # so a misspelled contributor here fails the boot instead of quietly
        # monitoring nothing.
        uptime:
          include: db,diskSpace,ping
  metrics:
    tags:
      application: beyou-backend
    distribution:
      percentiles-histogram:
        http.server.requests: true
